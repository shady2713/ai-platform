# 上游接入台账（06-upstream-upgrade.md §3 要求）
#
# 范围：本文件当前只登记 F02「验证并冻结第一组上游依赖」的对象：
#   模型/嵌入 SDK（Spring AI 1.1 线）、向量检索（Qdrant 服务端 + Java 客户端）、文档解析链（Tika/PDFBox/POI）。
#   前端图表（AntV/GPT-Vis）由 F04 追加；模型端点与 Ollama（服务版本/digest/提示词版本）由 M03/O04 追加；
#   基础框架基线由 00/F01 维护。F02 未登记的组件不代表已验证。
#
# 规则（06 §3）：unknown/pending 明确阻止依赖冻结任务完成；不能填伪造 hash、镜像 digest 或「已兼容」。

schemaVersion: 1
registryId: ai-platform-upstream-registry
updatedAt: "2026-09-26"
updatedBy: F02 执行模型（复核：主管；冻结值已落在 basic-framework-dependencies/pom.xml）

statusVocabulary:
  verified: 本机可复现的命令或官方元数据核验支持该结论（每条都附 evidence）
  pending: 有候选结论但证据不全，或本机环境无法验证
  no-go: 已否决，附否决依据
  not-adopted: 本期不引入，且未做验证（不得被下游当作可用候选）

evidenceArchive: .local-state/f02-upstream/（Git 忽略的本机证据归档，不是交付物路径）
compatMatrixDoc: docs/integrations/ai-platform-upstream-candidates.md
evidenceDoc: docs/integrations/f02-upstream-dependency-freeze-evidence.md
managedIn: 后端代码/basic-framework-boot/basic-framework-dependencies/pom.xml

