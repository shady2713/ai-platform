# 最小生产形态编排：MySQL 8.4 + Redis 7 + 后端（prod profile）。
# 环境变量从同目录 .env 注入（模板见 .env.example）；所有秘密缺失时直接拒绝渲染。
# 启动前须先构建可执行 jar，见 docs/deployment.md。
name: basic-framework

services:
  mysql:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MySQL root 密码}
      MYSQL_DATABASE: basic_framework
      # 以下四项供 script/mysql/init 的首次初始化脚本创建 ADR 0009 双账号
      DB_USERNAME: ${DB_USERNAME:?必须设置应用数据库账号}
      DB_PASSWORD: ${DB_PASSWORD:?必须设置应用数据库密码}
      FLYWAY_USERNAME: ${FLYWAY_USERNAME:?必须设置 Flyway 迁移账号}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?必须设置 Flyway 迁移密码}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./script/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?必须设置 Redis 密码}']
    # redis-cli 读取 REDISCLI_AUTH 完成健康检查认证，避免密码出现在进程参数
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?必须设置 Redis 密码}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ./basic-framework-server
    image: basic-framework-server:local
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: basic_framework
      DB_USERNAME: ${DB_USERNAME:?必须设置应用数据库账号}
      DB_PASSWORD: ${DB_PASSWORD:?必须设置应用数据库密码}
      FLYWAY_USERNAME: ${FLYWAY_USERNAME:?必须设置 Flyway 迁移账号}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?必须设置 Flyway 迁移密码}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须设置 Redis 密码}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?必须设置 32 字节 Base64 加密密钥}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?必须设置管理端域名}
      SMS_CALLBACK_ENABLED: ${SMS_CALLBACK_ENABLED:-false}
        SMS_CALLBACK_TOKEN: ${SMS_CALLBACK_TOKEN:-}
        PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-false}
        PROMETHEUS_SCRAPE_TOKEN: ${PROMETHEUS_SCRAPE_TOKEN:-}
      FILE_PRESIGNED_UPLOAD_TTL: ${FILE_PRESIGNED_UPLOAD_TTL:-15m}
      FILE_PRESIGNED_UPLOAD_MAX_SIZE: ${FILE_PRESIGNED_UPLOAD_MAX_SIZE:-16MB}
    ports:
      - '48080:48080'
    volumes:
      # prod 日志路径 ${user.home}/logs，见 basic-framework-server/Dockerfile 注释
      - app-logs:/home/app/logs
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  app-logs:
