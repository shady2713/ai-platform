# Repo-level git hooks. Install after the frozen frontend dependency install:
# node 前端代码/basic-framework-admin/node_modules/lefthook/bin/index.js install
# Frontend lint steps run via scripts/pre-commit-frontend.sh because the
# frontend toolchain needs the frontend dir as CWD.

# Resolve the locked frontend tool from the Git root on Windows and Linux.
lefthook: node "./前端代码/basic-framework-admin/node_modules/lefthook/bin/index.js"

pre-commit:
  parallel: true
  commands:
    whitespace-and-newline:
      run: git diff --cached --check
    secret-scan:
      run: sh scripts/secret-scan.sh
    frontend-lint-staged:
      glob: "前端代码/basic-framework-admin/**"
      run: sh scripts/pre-commit-frontend.sh

commit-msg:
  commands:
    commitlint:
      run: cd 前端代码/basic-framework-admin && pnpm exec commitlint --config ./internal/lint-configs/commitlint-config/index.mjs --edit "{1}"
